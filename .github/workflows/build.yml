name: Android Build

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sklad-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Mark green build
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p .ci
          {
            echo "GREEN"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "WORKFLOW=$GITHUB_WORKFLOW"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "ARTIFACT=Sklad-debug"
          } > .ci/last-green-build.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/last-green-build.txt
          git commit -m "ci: record successful Android build" || exit 0
          git pull --rebase origin main
          git push
