name: Android Build

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify bundled stock workbook source exists
        run: test -s "Залишки.XLSX"
      - name: Verify source workbook contains 3569 importable stock rows
        run: |
          python3 - <<'PY'
          import zipfile
          import xml.etree.ElementTree as ET

          path = "Залишки.XLSX"
          ns = {"m": "http://schemas.openxmlformats.org/spreadsheetml/2006/main"}
          with zipfile.ZipFile(path) as book:
              shared = []
              if "xl/sharedStrings.xml" in book.namelist():
                  root = ET.fromstring(book.read("xl/sharedStrings.xml"))
                  shared = ["".join(t.text or "" for t in si.findall(".//m:t", ns))
                            for si in root.findall("m:si", ns)]
              sheet = ET.fromstring(book.read("xl/worksheets/sheet1.xml"))
              count = 0
              for row in sheet.findall(".//m:sheetData/m:row", ns):
                  cells = {}
                  for cell in row.findall("m:c", ns):
                      ref = cell.attrib.get("r", "A1")
                      letters = "".join(c for c in ref if c.isalpha())
                      col = 0
                      for ch in letters.upper():
                          col = col * 26 + ord(ch) - ord("A") + 1
                      raw = cell.find("m:v", ns)
                      value = "" if raw is None else (raw.text or "")
                      if cell.attrib.get("t") == "s" and value:
                          value = shared[int(value)]
                      cells[col - 1] = value.strip()
                  first = cells.get(0, "")
                  if first and "склад" not in first.lower() and "warehouse" not in first.lower() and len(cells) >= 10:
                      count += 1
          print(f"Importable stock rows: {count}")
          if count != 3569:
              raise SystemExit(f"Expected 3569 importable stock rows, got {count}")
          PY
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK contains bundled stock workbook
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/Залишки.XLSX'
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sklad-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Mark green build
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p .ci
          {
            echo "GREEN"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "WORKFLOW=$GITHUB_WORKFLOW"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "ARTIFACT=Sklad-debug"
          } > .ci/last-green-build.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/last-green-build.txt
          git commit -m "ci: record successful Android build" || exit 0
          git pull --rebase origin main || { git rebase --abort || true; echo "Build succeeded; green marker update skipped due to concurrent change."; exit 0; }
          git push || { echo "Build succeeded; green marker push was skipped."; exit 0; }
